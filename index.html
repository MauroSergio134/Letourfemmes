<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour femmes -Classificação</title>
    <style>
        /* Aqui vem o CSS */
        *   {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
             }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color:#222;
            background-color: #f7f8f1;
             }
        nav{
            position: fixed;
            top: 0;
            width: 100%;
            height: 90px;
            background-color: #26311a; 
            color: #fff; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;  
            transition: height 0.4s; 
            z-index: 10;  
        }     

        nav.pequena{
            height: 55px;

        }
        nav a{
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
        }

        .logo{
            font-weight: bold;
            color:#cBe477;
        }

        .hero{
            height: 100vh;
            background: linear-gradient(135deg,#d6e69e,#fff);
            display : flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }
        .hero h1{
            font-size: clamp(36px,7vw,80px);
            margin-bottom: 10px;
        
        }
        .hero p{
            font-size:22px;
        }
        section{
            padding: 80px 8%;
        }

        h2{
            font-size: 32px;
        }
        .tabela-scroll{
            overflow-x: auto;
        }

        table{
            width: 100%;
            background: #fff;
            border-collapse: collapse;

        }
        th{
            background: #8bae22;
            color: #fff;
       
        }
        td,th{
            padding:15px;
            text-align: left;
            border-bottom:1px solid #ddd;
            
        }

    </style>
</head>
<body>
    <nav id="navbar">
        <div class="logo">Le Tour femmes</div>
        <div>
            <a href="#Classificação">Classificação</a>
            <a href="#graficos">Gráficos</a>
            <a href="#sobre">Sobre</a>
        </div>
    </nav>  
    <header class="hero">
        <div>
            <h1> General Classification</h1>
            <p> Classificação após a etapa 6</p>
            <a href="#Classificação">Ver Classificação</a> 
        </div>
    </header>


    <main>
        <section id="Classificação">
            <h2>Classificação Geral</h2>
            <p> Clica num ciclista para ver os seus detalhes</p>   
            <div id="tabela-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Posição</th>
                            <th>Nome</th>
                            <th>Equipa</th>
                            <th>Tempo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>2</td>
                            <td>3</td>
                            <td>4</td>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td>2</td>
                            <td>3</td>
                            <td>4</td>
                        </tr>
                </table>
            </div>
        </section>
    </main>
    <div id="modal" class="modal">
        <div class="modal-card">
            <button id="fechar">x</button>
        </div>
<script>
    /* Aqui vem o JavaScript */
    const navbar = document.getElementById('navbar');

    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            navbar.classList.add('pequena');
        } else {
            navbar.classList.remove('pequena');
        }
    });

</script>
</body>
</html>
